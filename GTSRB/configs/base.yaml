name: base
data:
  img_size: 64
  use_roi: true   # cắt theo khung ROI trước khi resize (khớp proposal)
  manifest: data/splits/split_manifest.csv
  cache: data/processed/gtsrb64.npz
aug:
  geo: true
  brightness: true
  blur: true
  brightness_range: [0.5, 1.3]
  blur_sigma: [0.1, 1.5]
  p: 0.5
train:
  epochs: 20
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
  num_workers: 2
model:
  name: resnet18
seed: 42
